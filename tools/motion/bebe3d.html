  [FO, F, V(x60 + 2.7, .85, 1.7), V(x60 + 2.25, .75, 1.25), V(x60 + .5, .55, 0), V(x60 + .5, .55, 0)],
  [F, G, V(x60 + .35, .05, 3.6), V(x60 + .15, 0, 3.0), V(x60, -.05, 0), V(x60, -.05, 0)],
  [G, H, V(x60 + .5, .3, 6.2), V(x60 + .2, .2, 5.0), V(x60, 0, 0), V(x60, 0, 0)],
  [H, I, V(x60, .3, 7.0), V(x60, .3, 7.6), V(x60, 0, 0), V(x60, 0, 0)],
  [I, END + 1, V(x60 + .8, .1, 5.0), V(x60 + .5, 0, 4.4), V(x60, -.2, 0), V(x60, -.2, 0)],
];
const LBL = [ // id, âncora (função), entra, sai
  ['L0', () => sand.getWorldPosition(V(0, 0, 0)).add(V(0, .55, 0)), P + .4, B - .15],
  ['L1', () => blast.getWorldPosition(V(0, 0, 0)).add(V(0, .4, 0)), P + .8, B - .15],
  ['L2', () => V(0, .05, -1.45), cue('endereço') - .35, C - .1],
  ['L3', () => heart.getWorldPosition(V(0, 0, 0)), cue('primeira', 1) - .3, D - .1],
  ['L4', () => hand.getWorldPosition(V(0, 0, 0)).add(V(0, .9, 0)), cue('essas') - .3, E - .1],
  ['L5', () => ear.getWorldPosition(V(0, 0, 0)), cue('primeira', 2) - .3, F - .1],
  ['L6', () => lungs[1].getWorldPosition(V(0, 0, 0)), cue('treino') - .3, G - .1],
  ['L7', () => head.getWorldPosition(V(0, 0, 0)), cue('posição') - .3, H - .1],
];
const LPOS = { L0: [-60, -260], L1: [-200, -300], L2: [60, -330], L3: [-80, -330], L4: [0, -300], L5: [-160, -380], L6: [80, -360], L7: [40, -380] };

// ===== pós-processamento =====
const composer = new EffectComposer(R);
composer.addPass(new RenderPass(scene, cam));
const bokeh = new BokehPass(scene, cam, { focus: 3, aperture: .0035, maxblur: .012 }); composer.addPass(bokeh);
composer.addPass(new UnrealBloomPass(new THREE.Vector2(540, 960), .4, .5, .85));
composer.addPass(new ShaderPass(GammaCorrectionShader));

// legenda em blocos de 2–3 palavras
const KEY = /^(bebê|areia|útero|endereço|coraçãozinho|batida|dedinhos|mãos|ouvidos|mãe|conversa|respirar|pulmão|cabeça|saída|lenda|dia|noite)$/i;
const CH = []; { let cur = []; CUES.forEach((c, i) => { cur.push(c); const end = /[.,:?!]$/.test(c.w) || cur.length === 3; if (end || i === CUES.length - 1) { CH.push(cur); cur = []; } }); }
const tl = (id, t, a, b, fade = .25) => { const el = $(id); const k = t < a ? 0 : t < a + fade ? (t - a) / fade : t < b ? 1 : t < b + fade ? 1 - (t - b) / fade : 0; el.style.opacity = k; return k; };
const popS = (id, t, a, b) => { const k = tl(id, t, a, b, .22); const s = t < a + .3 ? .6 + .4 * eout(seg(t, a, a + .3)) * 1.08 : 1; $(id).style.transform = `scale(${s})`; return k; };
const v3 = new THREE.Vector3(); const toScreen = p => { v3.copy(p).project(cam); return [(v3.x + 1) / 2 * 1080, (1 - v3.y) / 2 * 1920]; };

window.seek = t => {
  // câmera
  const sh = SH.find(s => t >= s[0] && t < s[1]) || SH[SH.length - 1]; const k = eio(seg(t, sh[0], sh[1]));
  cam.position.lerpVectors(sh[2], sh[3], k); const look = V(0, 0, 0).lerpVectors(sh[4], sh[5], k);
  cam.position.y += Math.sin(t * .7) * .02; cam.lookAt(look);
  bokeh.uniforms.focus.value = cam.position.distanceTo(look); bokeh.uniforms.aperture.value = t > H && t < I ? .02 : .0035;
  key.position.copy(cam.position).add(V(1.2, 1.4, .4)); rim.position.copy(look).add(V(-1.2, .8, -1.6));
  // partículas
  for (let i = 0; i < NP; i++) { pp[i * 3] = pb[i * 3] + Math.sin(t * .3 + i) * .15; pp[i * 3 + 1] = pb[i * 3 + 1] + Math.sin(t * .2 + i * 1.7) * .2 + t * .01; pp[i * 3 + 2] = pb[i * 3 + 2] + Math.cos(t * .25 + i) * .15; }
  pg.attributes.position.needsUpdate = true;
  // A/B blastocisto
  const drift = eio(seg(t, B + .2, GR + .6));
  blast.position.set(Math.sin(t * .6) * .05 * (1 - drift), Math.sin(t * .8) * .06 * (1 - drift), -1.3 * drift);
  blast.rotation.set(t * .15, t * .22, 0); sand.rotation.set(t * .05, t * .08, 0); sand.visible = t < B + .5;
  tendr.forEach((m, i) => m.scale.setScalar(eout(seg(t, GR + .3 + i * .05, GR + 1.3 + i * .05))));
  // C embrião
  const bpm = 2.4, ph = (t * bpm) % 1, beat = t > BT - .2 ? (ph < .15 ? Math.sin(ph / .15 * Math.PI) : 0) : 0;
  heart.scale.setScalar(1 + .35 * beat); heart.material.emissiveIntensity = .9 + 1.4 * beat; emb.rotation.y = Math.sin(t * .3) * .2;
  heartRings.forEach((r, i) => { const q = ((t * bpm) + i / 3) % 1; r.scale.setScalar(1 + q * 2.2); r.material.opacity = t > BT - .2 ? (1 - q) * .7 : 0; r.lookAt(cam.position); });
  // D mão
  const sp = eio(seg(t, DD + .2, DD + 2.2)); fingers.forEach((f, i) => f.rotation.z = (i - 1.5) * .22 * sp); web.material.opacity = .9 * (1 - sp); web.visible = sp < .99;
  hand.rotation.set(Math.sin(t * .5) * .05, Math.sin(t * .4) * .15, 0);
  // E feto
  const turn = eio(seg(t, G + .4, G + 4.6)); fet.rotation.set(0, Math.sin(t * .25) * .12, Math.PI * turn); fet.position.y = Math.sin(t * .6) * .04;
  uter.scale.setScalar(1 - .32 * eio(seg(t, G, G + 5)));
  head.rotation.y = Math.sin(t * .4) * .1;
  const xr = seg(t, F - .2, F + .4) * (1 - seg(t, G - .4, G)); skinF.opacity = 1 - .62 * xr; lungs.forEach(l => { l.visible = xr > .01; const b = 1 + .12 * Math.sin(t * 3.2); l.scale.set(b, 1.4 * b, .8 * b); });
  drops.forEach((d, i) => { const q = ((t * .5) + i / drops.length) % 1, out = Math.sin(t * 1.6) > 0; d.visible = xr > .1; d.position.set(Math.sin(i) * .05, .38 - (out ? 1 - q : q) * .45, .45 - (out ? 1 - q : q) * .3); });
  const earP = ear.getWorldPosition(V(0, 0, 0)), src = V(x60 + 3.0, 1.9, -1.2);
  sRings.forEach((r, i) => { const q = ((t * .45) + i / 4) % 1, on = t > FO - .2 && t < F; r.position.lerpVectors(src, earP, q); r.scale.setScalar(1.6 - q); r.material.opacity = on ? Math.sin(q * Math.PI) * .9 : 0; r.lookAt(earP); });
  mouth.rotation.z = Math.PI; mouth.scale.y = t > FO && t < F ? 1.4 : 1;
  // visibilidade por cena
  SM.visible = t < P + .05; SA.visible = t >= P - .05 && t < C;
  scene.background.set(t < P ? '#14060e' : '#240510'); scene.fog.density = t < P ? .02 : .06; dot.scale.setScalar(1 + .25 * Math.sin(t * 6));
  let punch = 0; LBL.forEach(([, , a]) => { const d = t - a; if (d > 0 && d < .45) punch = Math.max(punch, Math.sin(d / .45 * Math.PI)); });
  cam.fov = 38 - 3.2 * punch; cam.updateProjectionMatrix();
  let fl = 0; SH.slice(1).forEach(s => { const d = t - s[0]; if (d >= 0 && d < .14) fl = Math.max(fl, .32 * (1 - d / .14)); }); $('flash').style.opacity = fl; SC.visible = t >= C - .05 && t < D; SD.visible = t >= D - .05 && t < E; SE.visible = t >= E - .05;
  composer.render();

  // ===== interface =====
  tl('title', t, .1, P - .3, .3); $('title').style.transform = `scale(${.9 + .1 * eout(seg(t, .1, .7))})`;
  const wk = t < B ? 3 : t < C ? 3 : t < D ? 3 + 3 * eout(seg(t, C, C + .8)) : t < E ? 6 + 4 * eout(seg(t, D, D + .8)) : t < F ? 10 + 14 * eout(seg(t, E, E + 1)) : t < G ? 24 + 4 * eout(seg(t, F, F + .8)) : 28 + 6 * eout(seg(t, G, G + .8));
  $('hudn').textContent = Math.round(wk); tl('hud', t, P + .8, H - .1, .3);
  let svg = '';
  LBL.forEach(([id, anc, a, b]) => { const kk = popS(id, t, a, b); if (kk > 0) { const [px, py] = toScreen(anc()); const el = $(id), [dx, dy] = LPOS[id];
    const lx = Math.max(40, Math.min(1040 - el.offsetWidth, px + dx - el.offsetWidth / 2)), ly = Math.max(260, py + dy); el.style.left = lx + 'px'; el.style.top = ly + 'px';
    const ax = lx + el.offsetWidth / 2, ay = ly + el.offsetHeight + 6; const e = eout(clamp((t - a) / .4));
    svg += `<line x1="${ax}" y1="${ay}" x2="${ax + (px - ax) * e}" y2="${ay + (py - ay) * e}" stroke="#fff" stroke-width="5" opacity="${kk}"/><circle cx="${px}" cy="${py}" r="${11 * e}" fill="#fff" opacity="${kk}"/>`; } });
  $('lines').innerHTML = svg;
  popS('b1', t, H + .2, I - .1); popS('b2', t, H + .4, I - .1); popS('stamp', t, cue('lenda') - .1, I - .1);
  if (t > cue('lenda') - .1 && t < cue('lenda') + .25) $('stamp').style.transform = `rotate(-12deg) scale(${2.2 - 1.2 * eout(seg(t, cue('lenda') - .1, cue('lenda') + .2))})`; else $('stamp').style.transform = 'rotate(-12deg)';
  popS('c1', t, cue('dia') - .25, END + 1); popS('c2', t, cue('noite') - .25, END + 1); tl('follow', t, cue('comenta') - .2, END + 1);
  // legenda
  let cur = null; for (const ch of CH) if (ch[0].s <= t + .03) cur = ch;
  const capOn = cur && t < (CH[CH.indexOf(cur) + 1]?.[0].s ?? END) && t > P - .05 && !(t > H && t < I && false);
  $('cap').innerHTML = capOn ? cur.map(c => { const w = c.w.replace(/[.,:?!]+$/, ''); return KEY.test(w) ? `<b>${w}</b>` : w; }).join(' ') : '';
  $('cap').style.top = (t > I ? 1500 : 1290) + 'px';
};
window.ready = document.fonts.ready.then(() => true);
</script></body></html>
