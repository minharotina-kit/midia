<script>
const CUES = window.CUES || [], END = window.END || 39.6;
const norm = w => w.toLowerCase().replace(/[^a-zà-ú0-9]/g, '');
const cue = (w, n = 1) => { let k = 0; for (const c of CUES) if (norm(c.w) === w && ++k === n) return c.s; throw 'cue ' + w + n; };
const clamp = x => Math.max(0, Math.min(1, x)), seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const $ = id => document.getElementById(id);

const R = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, preserveDrawingBuffer: true });
R.setSize(1080, 1920, false); R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#2c1f3d');
const cam = new THREE.PerspectiveCamera(42, 1080 / 1920, .05, 400);
const hemi = new THREE.HemisphereLight('#fff2df', '#5b4636', .62); scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffe7c4', .95); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 40 }); sun.shadow.bias = -.002; scene.add(sun, sun.target);
const MAT = {}; const mat = (c, flat = true) => MAT[c + flat] || (MAT[c + flat] = new THREE.MeshLambertMaterial({ color: c, flatShading: flat }));
const basic = c => new THREE.MeshBasicMaterial({ color: c });
function mesh(g, c, p, parent, flat = true) { const m = new THREE.Mesh(g, typeof c === 'string' ? mat(c, flat) : c); m.castShadow = m.receiveShadow = true; if (p) m.position.set(...p); parent.add(m); return m; }
const grp = (parent, p = [0, 0, 0]) => { const g = new THREE.Group(); g.position.set(...p); parent.add(g); return g; };

// ---------- personagens fofos ----------
function person(parent, p, o) {
  const k = o.kid ? 1 : 0, g = grp(parent, p), skin = o.skin || '#f3c9a0';
  const L = k ? .22 : .42, bodyY = k ? .58 : .98, headY = k ? 1.08 : 1.58, hr = k ? .31 : .25;
  const legs = [-1, 1].map(s => { const h = grp(g, [s * (k ? .09 : .11), L + .05, 0]); mesh(new THREE.CapsuleGeometry(k ? .085 : .1, L, 3, 8), o.pants || '#3b4a6b', [0, -L / 2, 0], h, false);
    mesh(new THREE.SphereGeometry(k ? .1 : .11, 8, 6), '#4a3428', [0, -L - .02, .04], h, false).scale.set(1, .6, 1.4); return h; });
  const body = mesh(new THREE.CapsuleGeometry(k ? .2 : .23, k ? .24 : .48, 4, 10), o.shirt, [0, bodyY, 0], g, false);
  if (o.band) mesh(new THREE.TorusGeometry(k ? .205 : .235, .03, 6, 16), o.band, [0, bodyY + .05, 0], g, false).rotation.x = Math.PI / 2;
  const sh = k ? .25 : .3, shY = k ? .76 : 1.3, al = k ? .24 : .4;
  const arms = [-1, 1].map(s => { const a = grp(g, [s * sh, shY, 0]); mesh(new THREE.CapsuleGeometry(k ? .06 : .07, al, 3, 8), o.shirt, [0, -al / 2 - .02, 0], a, false);
    mesh(new THREE.SphereGeometry(k ? .07 : .075, 8, 6), skin, [0, -al - .08, 0], a, false); a.rotation.z = s * .12; return a; });
  const head = grp(g, [0, headY, 0]);
  mesh(new THREE.SphereGeometry(hr, 20, 16), skin, [0, 0, 0], head, false);
  const hair = mesh(new THREE.SphereGeometry(hr * 1.06, 20, 12, 0, Math.PI * 2, 0, Math.PI * .5), o.hair, [0, .02, -.02], head, false); hair.rotation.x = -.35;
  if (o.bun) mesh(new THREE.SphereGeometry(hr * .45, 12, 10), o.hair, [0, hr * .75, -hr * .7], head, false);
  if (o.cap) { mesh(new THREE.ConeGeometry(hr * .8, hr * 1.4, 12), '#d6453d', [0, hr * 1.15, -.04], head, false).rotation.x = -.25; mesh(new THREE.SphereGeometry(hr * .16, 8, 6), '#ffffff', [0, hr * 1.8, -.2], head, false); mesh(new THREE.TorusGeometry(hr * .82, hr * .12, 6, 18), '#ffffff', [0, hr * .5, -.02], head, false).rotation.x = Math.PI / 2 - .25; }
  const eyes = [-1, 1].map(s => { const e = grp(head, [s * hr * .38, hr * .08, hr * .86]);
    mesh(new THREE.SphereGeometry(hr * .2, 12, 10), '#ffffff', [0, 0, 0], e, false).scale.set(1, 1.12, .45);
    const pu = mesh(new THREE.SphereGeometry(hr * .13, 12, 10), '#1d1410', [0, -hr * .01, hr * .06], e, false); pu.scale.set(1, 1.1, .5);
    mesh(new THREE.SphereGeometry(hr * .045, 6, 4), basic('#ffffff'), [hr * .04, hr * .05, hr * .12], e); return e; });
  const brows = [-1, 1].map(s => { const b = mesh(new THREE.BoxGeometry(hr * .26, hr * .05, hr * .05), o.hair, [s * hr * .38, hr * .36, hr * .86], head, false); return b; });
  [-1, 1].forEach(s => mesh(new THREE.SphereGeometry(hr * .13, 10, 8), '#ff9e91', [s * hr * .6, -hr * .2, hr * .75], head, false).scale.set(1, .7, .35));
  mesh(new THREE.SphereGeometry(hr * .1, 8, 6), '#e9a37a', [0, -hr * .06, hr * .98], head, false);
  const smile = mesh(new THREE.TorusGeometry(hr * .17, hr * .04, 6, 12, Math.PI), '#7a2f2f', [0, -hr * .28, hr * .93], head, false); smile.rotation.z = Math.PI;
  const oh = mesh(new THREE.SphereGeometry(hr * .1, 10, 8), '#5a1f1f', [0, -hr * .33, hr * .92], head, false); oh.scale.set(1, 1.3, .4); oh.visible = false;
  return { g, head, arms, legs, body, eyes, brows, smile, oh, hr };
}
function face(P, mood) { // 'feliz' | 'susto'
  const s = mood === 'susto'; P.smile.visible = !s; P.oh.visible = s;
  P.eyes.forEach(e => e.scale.setScalar(s ? 1.18 : 1));
  P.brows.forEach((b, i) => { b.rotation.z = s ? (i ? -.35 : .35) : 0; b.position.y = P.hr * (s ? .42 : .36); });
}

// ---------- SALA DA CEIA (cenas 1, 2, 4, 8) ----------
const ROOM = grp(scene);
mesh(new THREE.BoxGeometry(14, .2, 12), '#b07a4a', [0, -.1, 0], ROOM);
for (let i = -6; i <= 6; i += 1.2) mesh(new THREE.BoxGeometry(.03, .01, 12), '#8d5f38', [i, .005, 0], ROOM).castShadow = false;
mesh(new THREE.BoxGeometry(14, 5, .2), '#f2e3c6', [0, 2.5, -3.6], ROOM);
mesh(new THREE.BoxGeometry(.2, 5, 12), '#ead6b4', [-5.5, 2.5, 0], ROOM);
mesh(new THREE.BoxGeometry(14, .5, .25), '#c99a6a', [0, .25, -3.45], ROOM);
// janela com noite e neve
const win = grp(ROOM, [2.3, 2.3, -3.48]);
mesh(new THREE.BoxGeometry(1.9, 1.5, .08), '#ffffff', [0, 0, 0], win);
mesh(new THREE.PlaneGeometry(1.7, 1.3), basic('#1c2f6b'), [0, 0, .05], win);
for (let i = 0; i < 18; i++) mesh(new THREE.SphereGeometry(.025, 4, 3), basic('#ffffff'), [(Math.sin(i * 7.3) * .8), (Math.cos(i * 3.1) * .6), .07], win);
mesh(new THREE.BoxGeometry(.06, 1.4, .1), '#ffffff', [0, 0, .06], win); mesh(new THREE.BoxGeometry(1.8, .06, .1), '#ffffff', [0, 0, .06], win);
// varal de luzinhas
const LIGHTS = []; for (let i = 0; i < 22; i++) { const x = -5 + i * .5, y = 3.7 - Math.abs(Math.sin(i * .55)) * .35;
  const c = ['#ff5a4f', '#ffd23f', '#5fd068', '#5ab4ff'][i % 4]; LIGHTS.push(mesh(new THREE.SphereGeometry(.06, 6, 5), basic(c), [x, y, -3.42], ROOM)); }
// árvore de Natal
const tree = grp(ROOM, [-3.2, 0, -2.4]);
mesh(new THREE.CylinderGeometry(.12, .15, .5, 6), '#7a4a2a', [0, .25, 0], tree);
[[1.0, 1.1, .9], [.8, .95, 1.6], [.55, .8, 2.25]].forEach(([r, h, y]) => mesh(new THREE.ConeGeometry(r, h, 7), '#2f8f4e', [0, y, 0], tree));
mesh(new THREE.OctahedronGeometry(.18), basic('#ffd23f'), [0, 2.8, 0], tree);
for (let i = 0; i < 14; i++) { const a = i * 2.4, y = .7 + (i % 5) * .38, r = .95 - (y - .5) * .33; mesh(new THREE.SphereGeometry(.07, 6, 5), basic(['#ff5a4f', '#ffd23f', '#5ab4ff', '#ffffff'][i % 4]), [Math.cos(a) * r, y, Math.sin(a) * r], tree); }
[[-.5, .9, '#d6453d'], [.6, .4, '#3fa9ff'], [.1, 1.1, '#f2c14e']].forEach(([x, z, c]) => { const b = mesh(new THREE.BoxGeometry(.45, .35, .45), c, [x, .18, z], tree); mesh(new THREE.BoxGeometry(.47, .37, .08), '#ffffff', [x, .18, z], tree); });
// mesa posta
const TBL = grp(ROOM, [0, 0, -.6]);
mesh(new THREE.BoxGeometry(3.2, .1, 1.5), '#ffffff', [0, .8, 0], TBL);
mesh(new THREE.BoxGeometry(3.25, .3, 1.55), '#d6453d', [0, .68, 0], TBL).scale.set(1, 1, 1);
[[-1.45, -.6], [1.45, -.6], [-1.45, .6], [1.45, .6]].forEach(([x, z]) => mesh(new THREE.BoxGeometry(.12, .7, .12), '#7a4a2a', [x, .35, z], TBL));
[[-1, .35], [0, .45], [1, .35], [-.5, -.4], [.6, -.4]].forEach(([x, z]) => { mesh(new THREE.CylinderGeometry(.24, .2, .04, 16), '#ffffff', [x, .87, z], TBL, false); });
const roast = mesh(new THREE.SphereGeometry(.32, 10, 8), '#a8582a', [-.1, 1.02, -.15], TBL); roast.scale.set(1.3, .75, 1);
mesh(new THREE.CylinderGeometry(.42, .38, .06, 16), '#e8e8e8', [-.1, .87, -.15], TBL, false);
[[1.0, -.2], [-1.1, -.25]].forEach(([x, z]) => { mesh(new THREE.CylinderGeometry(.05, .05, .35, 8), '#fff6e3', [x, 1.03, z], TBL, false); mesh(new THREE.ConeGeometry(.04, .1, 6), basic('#ffb52e'), [x, 1.26, z], TBL); });
const bowl = grp(TBL, [.55, .86, .1]); mesh(new THREE.CylinderGeometry(.26, .16, .14, 14), '#3fa9ff', [0, .07, 0], bowl, false);
const BUNCH = []; for (let i = 0; i < 16; i++) { const a = i * 2.1, r = .05 + (i % 4) * .045, y = .16 + Math.floor(i / 5) * .06;
  BUNCH.push(mesh(new THREE.SphereGeometry(.055, 10, 8), '#7b3fa0', [Math.cos(a) * r, y, Math.sin(a) * r], bowl, false)); }
const chair = mesh(new THREE.BoxGeometry(.6, .45, .55), '#8d5f38', [.55, .22, -1.55], ROOM);
const KID = person(ROOM, [.55, .45, -1.5], { kid: 1, shirt: '#d6453d', band: '#ffffff', hair: '#5a3a22', cap: 1 });
const MOM = person(ROOM, [-1.0, 0, -1.6], { shirt: '#2f8f6a', hair: '#3a2416', bun: 1, pants: '#2b3550' });
const GRAPE = mesh(new THREE.SphereGeometry(.07, 12, 10), '#7b3fa0', [0, 0, 0], ROOM, false); GRAPE.visible = false;

// ---------- CORTE DA GARGANTA (cena 3) ----------
const XR = grp(scene, [40, 0, 0]);
mesh(new THREE.BoxGeometry(30, 30, .2), basic('#123b44'), [0, 1, -1.2], XR);
for (let i = -10; i <= 10; i++) { mesh(new THREE.BoxGeometry(.02, 30, .01), basic('#1d5560'), [i * .5, 1, -1.05], XR); mesh(new THREE.BoxGeometry(30, .02, .01), basic('#1d5560'), [0, i * .5 + 1, -1.05], XR); }
const skinT = new THREE.MeshLambertMaterial({ color: '#f3c9a0', transparent: true, opacity: .8 });
const hd = mesh(new THREE.CylinderGeometry(1.0, 1.0, .3, 32), skinT, [0, 1.75, 0], XR); hd.rotation.x = Math.PI / 2; hd.scale.set(1, 1, 1.1);
mesh(new THREE.BoxGeometry(.9, 1.6, .3), skinT, [-.05, .45, 0], XR);
mesh(new THREE.SphereGeometry(.2, 12, 10), skinT, [.98, 1.62, 0], XR).scale.set(1, .8, .6);
mesh(new THREE.BoxGeometry(.5, .18, .3), skinT, [.75, 1.05, 0], XR);
const eyeX = mesh(new THREE.SphereGeometry(.08, 10, 8), '#1d1410', [.6, 2.0, .16], XR, false);
const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(1.05, 1.28, .05), new THREE.Vector3(.55, 1.3, .05), new THREE.Vector3(.12, 1.05, .05), new THREE.Vector3(.02, .55, .05), new THREE.Vector3(0, -.4, .05)]);
const tubeM = new THREE.MeshLambertMaterial({ color: '#ff8a9a' });
const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, .1, 12, false), tubeM); tube.position.z = 0; XR.add(tube);
const XG = mesh(new THREE.SphereGeometry(.14, 14, 12), '#7b3fa0', [0, 0, 0], XR, false);
const AIR = []; for (let i = 0; i < 14; i++) AIR.push(mesh(new THREE.SphereGeometry(.035, 6, 5), basic('#bfe9ff'), [0, 0, 0], XR));

// ---------- BEBÊ (cena 5) ----------
const BB = grp(scene, [-40, 0, 0]);
mesh(new THREE.BoxGeometry(12, .2, 12), '#f6d7e4', [0, -.1, 0], BB);
mesh(new THREE.BoxGeometry(12, 8, .2), '#d9ecf7', [0, 4, -3], BB);
const forearm = mesh(new THREE.CapsuleGeometry(.16, 1.5, 4, 10), '#f3c9a0', [0, 1.0, 0], BB, false); forearm.rotation.z = Math.PI / 2 - .25;
const sleeve = mesh(new THREE.CylinderGeometry(.21, .21, .5, 12), '#2f8f6a', [.95, 1.24, 0], BB, false); sleeve.rotation.z = Math.PI / 2 - .25;
const baby = grp(BB, [0, 1.2, 0]);
mesh(new THREE.CapsuleGeometry(.13, .25, 4, 10), '#fff2a8', [0, 0, 0], baby, false).rotation.z = Math.PI / 2;
const bHead = mesh(new THREE.SphereGeometry(.15, 14, 12), '#f6d2b0', [-.32, -.02, 0], baby, false);
mesh(new THREE.SphereGeometry(.155, 14, 8, 0, Math.PI * 2, 0, 1.2), '#c08a5a', [-.33, 0, 0], baby, false).rotation.z = .9;
[-1, 1].forEach(s => mesh(new THREE.CapsuleGeometry(.045, .12, 3, 6), '#fff2a8', [.22, -.06, s * .1], baby, false).rotation.z = 1.3);
const hand = grp(BB, [0, 2, 0]); mesh(new THREE.BoxGeometry(.32, .08, .26), '#f3c9a0', [0, 0, 0], hand, false); mesh(new THREE.CapsuleGeometry(.07, .5, 3, 8), '#f3c9a0', [.3, .2, 0], hand, false).rotation.z = 1.0;
const fingers = grp(BB, [0, 2, 0]); [-1, 1].forEach(s => mesh(new THREE.CapsuleGeometry(.04, .28, 3, 8), '#f3c9a0', [0, 0, s * .05], fingers, false));
const blanket = mesh(new THREE.BoxGeometry(1.6, .08, 1.1), '#bfe0ff', [0, .3, 0], BB); blanket.visible = false;

// ---------- TELEFONE 192 (cena 6) ----------
const PH = grp(scene, [-80, 0, 0]);
mesh(new THREE.BoxGeometry(12, 12, .2), basic('#173f4a'), [0, 2, -1.5], PH);
const phone = grp(PH, [0, 1.6, 0]); mesh(new THREE.BoxGeometry(1.1, 2.1, .14), '#23323d', [0, 0, 0], phone);
const cv = document.createElement('canvas'); cv.width = 400; cv.height = 760; const cx = cv.getContext('2d');
cx.fillStyle = '#e9f7ff'; cx.fillRect(0, 0, 400, 760); cx.fillStyle = '#10242a'; cx.font = 'bold 150px Fredoka'; cx.textAlign = 'center'; cx.fillText('192', 200, 330);
cx.font = 'bold 60px Fredoka'; cx.fillText('SAMU', 200, 420); cx.fillStyle = '#2fbf5a'; cx.beginPath(); cx.arc(200, 600, 80, 0, 7); cx.fill();
cx.fillStyle = '#fff'; cx.font = 'bold 70px Fredoka'; cx.fillText('☎', 200, 625);
const scrM = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv) }); const scr = new THREE.Mesh(new THREE.PlaneGeometry(.98, 1.86), scrM); scr.position.z = .075; phone.add(scr);

// ---------- UVA EM 4 (cena 7) ----------
const CT = grp(scene, [80, 0, 0]);
mesh(new THREE.BoxGeometry(12, .2, 12), '#b07a4a', [0, -.1, 0], CT);
mesh(new THREE.BoxGeometry(12, 8, .2), '#f2e3c6', [0, 4, -3], CT);
mesh(new THREE.BoxGeometry(2.4, .14, 1.6), '#d9a06a', [0, .07, 0], CT);
const Q = []; for (let i = 0; i < 4; i++) { const qg = grp(CT, [0, .62, 0]);
  const geo = new THREE.SphereGeometry(.48, 20, 16, i * Math.PI / 2, Math.PI / 2); mesh(geo, '#7b3fa0', [0, 0, 0], qg, false);
  const inner = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: '#cfe89a', side: THREE.BackSide })); qg.add(inner); qg.scale.set(1, 1.15, 1); Q.push(qg); }
mesh(new THREE.CylinderGeometry(.03, .03, .2, 6), '#6b8a3a', [0, 1.25, 0], CT);
const knife = grp(CT, [0, 2.4, 0]); mesh(new THREE.BoxGeometry(.04, 1.0, 1.4), '#d8dde3', [0, 0, 0], knife); mesh(new THREE.BoxGeometry(.12, .3, .5), '#3a2a20', [0, .55, -.9], knife);

// ---------- câmeras por cena ----------
const T1 = cue('ele') - .1, T2 = cue('a') - .15, T3 = cue('se') - .15, T3b = cue('saiu') - .35, T4 = cue('se', 2) - .15, T4b = cue('compressões', 2) - .15,
  T5 = cue('liga') - .35, T6 = cue('ceia', 2) - .35, T7 = cue('salva') - .15;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const SH = [ // [início, fim, grupo visível, pos0, pos1, look0, look1]
  [0, T1, ROOM, V(2.6, 3.6, 5.2), V(1.25, 1.85, 1.4), V(.3, 1.0, -1), V(.55, 1.45, -1.5)],
  [T1, T2, ROOM, V(.95, 1.75, .7), V(.75, 1.7, .45), V(.55, 1.5, -1.5), V(.55, 1.5, -1.5)],
  [T2, T3, XR, V(40.35, 1.05, 6.4), V(40.45, 1.0, 5.5), V(40.35, 1.0, 0), V(40.4, .95, 0)],
  [T3, T4, ROOM, V(3.3, 1.5, 3.0), V(2.6, 1.35, 3.6), V(0, .9, 1.7), V(0, .85, 1.7)],
  [T4, T5, BB, V(-40, 2.0, 3.3), V(-39.6, 1.9, 2.8), V(-40, 1.15, 0), V(-40, 1.0, 0)],
  [T5, T6, PH, V(-80, 1.6, 4.4), V(-80, 1.6, 3.6), V(-80, 1.6, 0), V(-80, 1.6, 0)],
  [T6, T7, CT, V(80, 2.6, 3.2), V(80.4, 2.2, 2.6), V(80, .6, 0), V(80, .6, 0)],
  [T7, END + 1, ROOM, V(.4, 2.6, 4.6), V(.2, 2.3, 4.0), V(0, 1.2, -1), V(0, 1.2, -1)],
];

// ---------- overlays (GSAP) ----------
const tl = gsap.timeline({ paused: true });
const pop = (id, t, out) => { tl.fromTo('#' + id, { opacity: 0, scale: .5 }, { opacity: 1, scale: 1, duration: .3, ease: 'back.out(2.2)', immediateRender: false }, t); if (out) tl.to('#' + id, { opacity: 0, duration: .2 }, out); };
SH.slice(1).forEach(([a]) => { tl.fromTo('#lines', { opacity: .9 }, { opacity: 0, duration: .35, immediateRender: false }, a); tl.fromTo('#flash', { opacity: .55 }, { opacity: 0, duration: .25, immediateRender: false }, a); });

tl.fromTo('#vig', { opacity: 0 }, { opacity: 1, duration: .5, yoyo: true, repeat: 9, immediateRender: false }, cue('para'));
tl.to('#vig', { opacity: 0, duration: .3 }, T3);
pop('tTosse', cue('tosse') - .05, T2 - .1); pop('tChora', cue('chora') - .05, T2 - .1); pop('tSom', cue('barulho') - .05, T2 - .1);
pop('yGrave', cue('engasgo') - .05, T2 - .1); pop('tTossir', cue('grave') + .25, T2 - .1);
pop('tAr', T2 + .4, T3 - .1); pop('yUva', cue('lisinha') - .3, T3 - .1); pop('yTampa', cue('tampa') - .05, T3 - .1);
pop('tFrente', cue('inclinado') - .1, T3b - .05); pop('tUmbigo', cue('barriga') - .1, cue('repete') - .2);
pop('aDentro', cue('dentro') - .05, cue('repete') - .2); pop('aCima', cue('cima') - .05, cue('repete') - .2);
pop('yRepete', cue('repete') - .05, T4 - .62); pop('ySaiu', T4 - .55, T4 - .05); tl.set('#ySaiu', { left: 0, right: 0, top: 1000 }, 0);
pop('tCabeca', T4 + .4, T4b - .1); pop('yDedos', cue('dedos') - .15, T5 - .1);
pop('yComprido', cue('quatro') - .1, T7 - .1);
pop('cta1', T7 + .2); pop('cta2', T7 + .9); pop('cta3', T7 + 1.3);
tl.to({}, { duration: .01 }, END);

// contagens 1..5
const HITS = (a, b) => Array.from({ length: 5 }, (_, i) => a + (b - a) * i / 4);
const H1 = HITS(cue('tapas') - .05, cue('frente') + .1), H2 = HITS(cue('barriga') - .1, cue('cima') + .45),
  H3 = HITS(cue('tapas', 2) - .05, cue('costas', 2) + .9), H4 = HITS(cue('peito') - .1, cue('dedos') + .45);
const hitN = (t, H) => H.filter(h => t >= h).length;
const pulse = (t, H) => { let m = 0; H.forEach(h => { const d = t - h; if (d >= 0 && d < .3) m = Math.max(m, 1 - d / .3); }); return m; };

function hud(lk, lv, rk, rv, alertR) { $('hlk').textContent = lk; $('hlv').textContent = lv; $('hrk').textContent = rk; $('hrv').textContent = rv; $('hr').classList.toggle('alert', !!alertR); $('hl').style.opacity = $('hr').style.opacity = lk ? 1 : 0; }
const v3 = new THREE.Vector3();
function place(id, obj, dx = 0, dy = 0) { const el = $(id); obj.getWorldPosition ? obj.getWorldPosition(v3) : v3.copy(obj); v3.project(cam); el.style.left = ((v3.x + 1) / 2 * 1080 - el.offsetWidth / 2 + dx) + 'px'; el.style.top = ((1 - v3.y) / 2 * 1920 + dy) + 'px'; }
const KEY = /^(uva|respirar|grave|engasgo|tampa|cinco|costas|barriga|bebê|peito|dedos|cento|noventa|dois|quatro|comprido|ceia|repete)$/i;

window.seek = t => {
  tl.seek(t, false);
  const sh = SH.find(s => t >= s[0] && t < s[1]) || SH[SH.length - 1];
  const k = eio(seg(t, sh[0], sh[1]));
  [ROOM, XR, BB, PH, CT].forEach(g => g.visible = g === sh[2]);
  cam.position.lerpVectors(sh[3], sh[4], k); const look = new THREE.Vector3().lerpVectors(sh[5], sh[6], k);
  if (t > cue('para') && t < T2) { cam.position.x += Math.sin(t * 41) * .012; cam.position.y += Math.cos(t * 37) * .01; }
  cam.lookAt(look);
  const base = sh[2].position; sun.target.position.copy(base).add(V(0, 0, 0)); sun.position.copy(base).add(V(3, 7, 5));
  scene.background.set(sh[2] === ROOM ? '#2c1f3d' : '#173f4a');
  LIGHTS.forEach((l, i) => l.scale.setScalar(.8 + .4 * Math.abs(Math.sin(t * 3 + i))));

  // ----- sala: personagens por fase -----
  const K = KID, Mo = MOM;
  K.g.rotation.set(0, 0, 0); Mo.g.rotation.set(0, 0, 0); K.head.rotation.set(0, 0, 0); Mo.head.rotation.set(0, 0, 0);
  K.arms.forEach((a, i) => a.rotation.set(0, 0, (i ? 1 : -1) * .12)); Mo.arms.forEach((a, i) => a.rotation.set(0, 0, (i ? 1 : -1) * .12));
  K.legs.forEach(l => l.rotation.set(0, 0, 0)); Mo.legs.forEach(l => l.rotation.set(0, 0, 0));
  GRAPE.visible = false; BUNCH[15].visible = true; chair.visible = true;
  if (t < T3) { // ceia: menino na cadeira atrás da mesa, mãe ao lado
    K.g.position.set(.55, .45, -1.5); Mo.g.position.set(-1.0, 0, -1.6); face(Mo, t > cue('para') + .2 ? 'susto' : 'feliz');
    face(K, t > cue('para') ? 'susto' : 'feliz');
    const pick = seg(t, cue('uva') - .4, cue('boca') + .1);
    if (t < cue('boca') + .1) { K.arms[1].rotation.x = -1.2 * Math.sin(pick * Math.PI); }
    if (t > cue('uva') - .2 && t < cue('boca') + .15) { BUNCH[15].visible = false; GRAPE.visible = true;
      const a = V(.55 + .1, 1.02, -.5), b = V(.55, 1.45, -1.2); GRAPE.position.lerpVectors(a, b, seg(t, cue('uva') - .2, cue('boca') + .1)); }
    if (t > cue('uva') - .2) BUNCH[15].visible = false;
    if (t > cue('para') - .1) { const r = eio(seg(t, cue('para') - .1, cue('para') + .3)); // mãos na garganta (sinal universal)
      K.arms[0].rotation.set(-2.2 * r, 0, -.12 + .5 * r); K.arms[1].rotation.set(-2.2 * r, 0, .12 - .5 * r); K.head.rotation.x = -.15 * r + Math.sin(t * 9) * .03 * r; }
    Mo.head.rotation.y = t > cue('para') + .2 ? -.7 : 0; if (t > cue('para') + .3) Mo.arms[1].rotation.x = -1.0;
  } else if (t < T4) { // manobra: menino em pé, mãe atrás
    chair.visible = false; K.g.position.set(0, 0, 1.75); Mo.g.position.set(0, 0, 1.3); face(Mo, 'feliz'); Mo.smile.visible = false;
    face(K, t > T4 - .6 ? 'feliz' : 'susto');
    if (t < T3b) { // 5 tapas nas costas, inclinado pra frente
      const lean = eio(seg(t, T3, T3 + .5)); K.g.rotation.x = .55 * lean; K.arms[0].rotation.x = K.arms[1].rotation.x = -.3;
      Mo.arms[0].rotation.x = -.9; const p = pulse(t, H1); Mo.arms[1].rotation.set(-2.3 + 1.0 * p, 0, .3); Mo.g.position.z = 1.15;
      K.g.position.z = 1.75 + .04 * p;
    } else { // 5 compressões na barriga
      const p = pulse(t, H2); K.g.rotation.x = .12; Mo.g.position.z = 1.42;
      Mo.arms.forEach((a, i) => a.rotation.set(-1.25 - .25 * p, 0, (i ? -1 : 1) * .55)); K.g.position.y = .06 * p;
      K.arms.forEach(a => a.rotation.x = -.4);
    }
    if (t > T4 - .6) { GRAPE.visible = true; const q = seg(t, T4 - .6, T4); GRAPE.position.set(0, 1.08 + q * .6 - q * q * 1.2, 2.05 + q * 1.6); K.g.rotation.x = 0; }
  } else { // final: família feliz à mesa
    K.g.position.set(.55, .45, -1.5); Mo.g.position.set(-.35, 0, -1.45); face(K, 'feliz'); face(Mo, 'feliz');
    Mo.arms[0].rotation.set(0, 0, -2.5 + Math.sin(t * 5) * .2); K.arms[1].rotation.set(-2.6 + Math.sin(t * 6) * .25, 0, .2); K.head.rotation.z = Math.sin(t * 3) * .08;
  }

  // ----- corte da garganta -----
  const blk = seg(t, cue('passagem') - .2, cue('tampa'));
  const gu = .05 + .45 * eio(blk); XG.position.copy(curve.getPoint(gu)).add(V(0, 0, .02));
  AIR.forEach((a, i) => { let u = ((t * .35 + i / AIR.length) % 1); if (t > cue('tampa')) { u = Math.min(u, gu - .04 - (i % 5) * .02); }
    a.position.copy(curve.getPoint(Math.max(0, u))).add(V(0, 0, .02)); a.visible = !(t > cue('tampa') && u > gu); });
  tubeM.color.set(t > cue('tampa') ? (Math.sin(t * 10) > 0 ? '#ff4a5a' : '#ff8a9a') : '#ff8a9a');

  // ----- bebê -----
  if (t < T4b) { baby.position.set(-.05, 1.36, 0); baby.rotation.set(0, 0, -.25); forearm.visible = sleeve.visible = true; blanket.visible = false; fingers.visible = false;
    hand.visible = true; const p = pulse(t, H3); hand.position.set(.12, 1.95 - .32 * p, 0); hand.rotation.set(0, 0, -.25); }
  else { forearm.visible = sleeve.visible = false; blanket.visible = true; hand.visible = false; fingers.visible = true;
    baby.position.set(0, .48, 0); baby.rotation.set(Math.PI, 0, 0); const p = pulse(t, H4); fingers.position.set(.02, .95 - .22 * p, 0); }

  // ----- telefone e uva em 4 -----
  phone.rotation.y = Math.sin(t * 2.2) * .18; phone.position.y = 1.6 + Math.sin(t * 3) * .05; phone.rotation.z = (t - T5) < .6 ? Math.sin(t * 40) * .06 : 0;
  const c1 = seg(t, cue('corta') - .1, cue('corta') + .35), c2 = seg(t, cue('quatro') - .15, cue('quatro') + .25), sep = eio(seg(t, cue('comprido') - .1, cue('comprido') + .5));
  knife.position.y = 2.4 - 1.5 * Math.sin(Math.max(c1, c2) * Math.PI); knife.rotation.y = c2 > 0 ? Math.PI / 2 : 0;
  Q.forEach((q, i) => { const a = i * Math.PI / 2 + Math.PI / 4; q.position.set(Math.cos(a) * .35 * sep * (i % 2 ? 1 : 1), .62, -Math.sin(a) * .35 * sep); q.rotation.y = 0; });

  R.render(scene, cam);

  // ----- HUD por cena -----
  const ar = Math.round(100 - 70 * eio(seg(t, cue('para'), T2)));
  if (t < T2) hud('CEIA', '24/12', 'AR', (t < cue('para') ? 100 : ar) + '%', t > cue('para'));
  else if (t < T3) hud('UVA', 'INTEIRA', 'AR', '30%', 1);
  else if (t < T3b) hud('IDADE', '+1 ANO', 'TAPAS', hitN(t, H1) + '/5');
  else if (t < T4 - .55) hud('IDADE', '+1 ANO', 'NA BARRIGA', hitN(t, H2) + '/5');
  else if (t < T4) hud('IDADE', '+1 ANO', 'AR', '100%');
  else if (t < T4b) hud('BEBÊ', '< 1 ANO', 'TAPAS', hitN(t, H3) + '/5');
  else if (t < T5) hud('BEBÊ', '< 1 ANO', 'NO PEITO', hitN(t, H4) + '/5');
  else if (t < T6) hud('LIGUE', 'SAMU', 'NÚMERO', '192');
  else if (t < T7) hud('ATÉ', '5 ANOS', 'PEDAÇOS', '4');
  else hud('', '', '', '');
  // contagem grande no centro
  const H = t < T3b && t > T3 ? H1 : t < T4 - .6 && t > T3b ? H2 : t > T4 && t < T4b ? H3 : t > T4b && t < T5 ? H4 : null;
  const n = H ? hitN(t, H) : 0; $('count').textContent = n || ''; $('count').style.opacity = n ? 1 : 0; if (H) $('count').style.transform = `scale(${1 + .35 * pulse(t, H)})`;

  // ----- rótulos presos nos objetos -----
  place('tUva', GRAPE.visible ? GRAPE : BUNCH[3], 0, -120);
  place('tTosse', KID.head, -250, -120); place('tChora', KID.head, -250, -30); place('tSom', KID.head, -250, 60);
  $('yGrave').style.left = '0px'; $('yGrave').style.right = '0px'; $('yGrave').style.top = '1080px';
  $('tTossir').style.left = '250px'; $('tTossir').style.top = '1210px';
  place('tAr', curve.getPoint(.82).clone().add(XR.position), 150, -30); place('yUva', XG, 170, -60); $('yTampa').style.left = '0px'; $('yTampa').style.right = '0px'; $('yTampa').style.top = '1150px';
  place('tFrente', KID.head, 0, -260); place('tUmbigo', KID.body, 0, 140);
  place('aDentro', KID.body, -260, -40); place('aCima', KID.body, -330, -200);
  $('yRepete').style.left = '0px'; $('yRepete').style.right = '0px'; $('yRepete').style.top = '1100px';
  place('tCabeca', bHead, -40, -260); place('yDedos', fingers, 0, -330);
  $('yComprido').style.left = '0px'; $('yComprido').style.right = '0px'; $('yComprido').style.top = '1110px';

  // ----- palavra por palavra -----
  let cur = '', cs = -1; for (const c of CUES) if (c.s <= t + .02) { cur = c.w.replace(/\.\.\./g, '').replace(/[.,?!:]+$/g, ''); cs = c.s; }
  if (t > END - .4 || t >= T7 + .2) cur = '';
  if (/^(cento|noventa)$/i.test(cur)) cur = '192'; if (cur === 'dois' && t > cue('liga')) cur = '192';
  const w = $('word'); w.textContent = cur; w.style.transform = `scale(${.86 + .14 * clamp((t - cs) / .1)})`; w.style.color = KEY.test(cur) || cur === '192' ? '#ffd23f' : '#ffffff';
  w.style.top = (t > T2 && t < T3) || (t > T6 && t < T7) ? '1400px' : '1330px';
};
window.ready = document.fonts.ready.then(() => true);
